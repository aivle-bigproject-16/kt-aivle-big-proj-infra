# 배터리 결함검사 생산 시뮬레이션 — 통합 인프라 형상
#
# 정본: 시스템 계약서 Core [실행/컨테이너] · [실행/프로파일] · [실행/환경변수]
# 이 파일은 계약이 아니라 계약의 구현이다. 값이 어긋나면 계약을 고치고 여기를 맞춘다.
#
# --- 이 파일이 계약과 다른 점 (2026-07-31 확정, DECISIONS 등록 필요) --------
# 1) 관계형 DB 를 컨테이너로 띄우지 않는다. Supabase PostgreSQL 을 직접 쓴다.
#    BE 코드가 이미 Supabase 에 붙어 있고 팀이 그 위에서 개발 중이다.
#    따라서 postgres 서비스와 postgres/initdb 마운트가 이 파일에 없다.
#    주의: Supabase 리전은 ap-southeast-2, S3 는 ap-northeast-2 다. 왕복 지연이 붙는다.
# 2) 오브젝트 스토리지도 컨테이너로 띄우지 않는다. 개발·배포 모두 AWS S3 단독이다.
#    개발자는 각자의 IAM 자격증명을 .env 에 넣는다. 오프라인 개발은 불가능하다.
# 3) BE 는 컨테이너 2개다. 경계는 아래와 같다.
#      module-api(8080) = FE 대응. REST · WebSocket · 인증 · 시뮬레이션 오케스트레이션.
#      module-ai (8081) = 모델 서버 연동 전담. vlm(8001) 과 ai-infer(8000) 를 둘 다 붙인다.
#    둘은 서로 다른 부트 앱이고 module-api 는 module-ai 에 의존하지 않는다.
#    module-api → module-ai 는 HTTP 호출이다.
#    계약 [실행/컨테이너]는 backend 1개(8종) 형상이라 9종으로 개정해야 한다.
#
# --- 구조 원칙 ---------------------------------------------------------------
# 1) 데이터 레이어(redis)는 프로파일이 없다. 항상 기동한다.
# 2) GPU 장치 예약(deploy.resources.reservations.devices)은 이 파일에 없다.
#    NVIDIA 런타임이 없는 머신에서 파싱 단계부터 실패하기 때문이다. compose.gpu.yaml 로 분리한다.
# 3) backend 는 ai-infer / vlm 에 depends_on 을 걸지 않는다.
#    런타임 HTTP 호출이지 기동 의존이 아니다. *_BASE_URL 환경변수로 붙는다.
#    GPU 없는 FE·BE 개발자도 backend 를 띄울 수 있어야 한다.
#
# --- 레지스트리 (2026-08-12 변경) --------------------------------------------
# GHCR 에서 ECR 로 옮겼다. EC2 가 같은 리전·같은 계정에서 받으므로 pull 이 빠르고,
# 인스턴스 프로파일로 인증되어 호스트에 액세스 키를 두지 않아도 된다.
# 이미지 주소는 ${ECR_REGISTRY}/<레포명>:<태그> 형태다.
#
# --- 기동 전 선행 과제 (2026-08-12 갱신) -------------------------------------
#   - BE Dockerfile 있음. MODULE 빌드 인자로 module-api / module-ai 를 고른다
#   - FE Dockerfile 있음. nginx.conf 정본은 FE 레포의 docker/nginx.conf 다
#   - ai-infer 이미지는 ECR 에 이미 있다 (태그 backend-contract-7b7980e)
#   - frontend · backend · backend-ai · vlm 4종은 아직 굽지 않았다
#
# --- AI 서비스 URL ------------------------------------------------------------
#   module-ai 는 서로 독립된 두 프로퍼티로 모델 서버를 호출한다.
#     ai-server.base-url  <- AI_SERVER_URL  -> ai-infer(8000), 셀 분석
#     llm-server.base-url <- LLM_SERVER_URL -> vlm(8001), 리포트 생성
#   compose 는 두 값을 각각 내부 서비스 주소로 주입한다.
#
# --- 기동 예시 ---------------------------------------------------------------
#   docker compose up -d                                  # redis 만
#   docker compose --profile app up -d                    # + FE·BE 2종 (GPU 불필요)
#   docker compose --profile app --profile stub up -d     # + AI 스텁 (GPU 없는 BE 개발자)
#   docker compose --profile app --profile llm up -d      # + vlm 만 (생성 모델 담당)
#   docker compose --profile app --profile ai up -d       # + ai-infer + vlm (GPU 보유)
#   docker compose -f compose.yaml -f compose.gpu.yaml --profile app --profile ai up -d   # EC2 배포

name: battery-inspection

services:
  # =====================================================================
  # Presentation
  # =====================================================================
  frontend:
    profiles: [app]
    image: ${ECR_REGISTRY}/kt-aivle-big-proj-frontend:${FRONTEND_TAG:?FRONTEND_TAG is required}
    container_name: battery-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"    # 유일한 외부 공개 포트. EC2 보안그룹 80/443만 개방
    depends_on:
      backend:
        condition: service_started
    networks: [battery-net]
    # nginx 역할 4가지: 정적 번들 서빙(SPA 폴백)
    #                   · /api      → backend:8080  접두어를 벗겨서 전달
    #                   · /ws       → backend:8080  접두어 유지. WebSocket 업그레이드
    #                   · /ai/logs  → ai-infer:8000 접두어를 벗겨서 전달. SSE
    # 접두어를 벗기는 규칙이 경로마다 다르다. BE 라우트에 /api 접두어가 없기 때문이다.
    # nginx.conf 정본 = FE 레포의 docker/nginx.conf. FE 이미지가 포함한다.
    # ai-infer 는 --profile ai 일 때만 존재하므로 nginx 가 upstream 을 변수로 잡아
    # 요청 시점에 DNS 를 푼다. 없으면 /ai/logs 만 502 가 되고 화면은 뜬다.
    # VITE_* 는 번들 시점 문자열 치환이다. 여기 environment: 로는 주입되지 않는다.
    # FE 이미지 빌드 시 docker build --build-arg VITE_API_BASE_URL=/api 로 넣는다.

  # =====================================================================
  # Application
  # =====================================================================
  backend:
    profiles: [app]
    image: ${ECR_REGISTRY}/kt-aivle-big-proj-backend:${BACKEND_TAG:?BACKEND_TAG is required}
    container_name: battery-backend
    restart: unless-stopped
    # module-api. FE 대상 REST + WebSocket + 인증 + 시뮬레이션 오케스트레이션.
    # 모델 서버(ai-infer·vlm)를 직접 호출하지 않는다. module-ai 를 거친다.
    environment:
      # module-api → module-ai 호출 주소.
      # 변수 이름이 반드시 AI_GATEWAY_URL 이어야 한다.
      # application.yml 이 ai-gateway.base-url: ${AI_GATEWAY_URL:http://localhost:8081} 로 읽는다.
      # 이전에 BACKEND_AI_BASE_URL 로 주고 있었는데 그 이름은 아무도 읽지 않아
      # 기본값 localhost:8081 로 떨어졌다. 컨테이너 안에서 localhost 는 자기 자신이므로
      # 리포트 생성이 전부 실패했다. 증상이 "리포트만 안 나옴" 이라 원인 추적이 오래 걸린다.
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-http://backend-ai:8081}

      # ai-infer 가 셀 분석을 끝내면 이 주소로 결과를 되돌려준다.
      # ai-infer 는 이 값과 요청에 담긴 callbackUrl 이 다르면 400 을 낸다.
      # 따라서 module-api · ai-infer 양쪽에 같은 값을 넣어야 한다.
      BACKEND_CALLBACK_URL: ${BACKEND_CALLBACK_URL:-http://backend:8080/internal/ai/callbacks/cell}

      # module-api · module-ai · ai-infer 세 곳이 공유하는 내부 호출 인증 키.
      # ai-infer 는 X-Internal-Api-Key 헤더로 검사하고 불일치 시 401 을 낸다.
      # 값이 없으면 내부 호출이 전부 막힌다. .env 에 반드시 채운다.
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}

      # DB = Supabase. 접속 URL·계정은 application.yml 에 있고 비밀번호만 주입한다.
      DB_PASSWORD: ${DB_PASSWORD}

      # 회원가입 이메일 인증(Gmail SMTP). 계약 [실행/환경변수]에 없는 변수다. 등재 필요.
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # Redis 가 죽어도 BE 는 산다. depends_on 하드 의존 금지.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 타임아웃을 지정하지 않으면 기본값이 60초라 캐시 장애 시 화면이 60초 멈춘다.
      # 캐시 장애 격리 기준(1초 이내 응답)을 통과하려면 이 두 값이 반드시 있어야 한다.
      # 현재 BE application.yml 에 이 설정이 없다. 기준 미달 상태다.
      SPRING_DATA_REDIS_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-300ms}
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-200ms}

      # 스토리지 = AWS S3 단독. 개발·배포 모두 같다.
      # S3_ENDPOINT 는 비운다. 비어 있으면 SDK 가 리전 기본 엔드포인트를 쓴다.
      # 주의: BE 코드는 이 값이 빈 문자열이면 endpointOverride 를 호출하지 않아야 한다.
      #       빈 URI 로 override 하면 기동 시점에 터진다.
      # 주의: BE 에 아직 S3·presigned 구현이 없다. 아래 변수는 구현 시점에 살아난다.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-ap-northeast-2}

      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xmx1g -Duser.timezone=Asia/Seoul"
    networks: [battery-net]
    # 포트 미게시. 외부 노출은 frontend 의 nginx 를 통해서만 한다.

  backend-ai:
    profiles: [app]
    image: ${ECR_REGISTRY}/kt-aivle-big-proj-backend-ai:${BACKEND_AI_TAG:?BACKEND_AI_TAG is required}
    container_name: battery-backend-ai
    restart: unless-stopped
    # module-ai. 모델 서버 연동 전담. vlm(8001) 과 ai-infer(8000) 를 둘 다 붙인다.
    # 두 경로 모두 코드가 있다.
    #   셀 분석  AiServerForwardService -> POST {ai-server.base-url}/ai/cells/analyze
    #   리포트    LlmWebClient           -> POST {llm-server.base-url}/vlm/reports/individual · /daily
    environment:
      DB_PASSWORD: ${DB_PASSWORD}

      # 셀 분석과 리포트 생성은 각각 독립된 백엔드 프로퍼티를 사용한다.
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-infer:8000}
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://vlm:8001}

      # 내부 호출 인증 키. module-api · ai-infer 와 같은 값이어야 한다.
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}

      # ai-infer. 호출 코드가 생기면 살아난다.
      AI_BASE_URL: ${AI_BASE_URL:-http://ai-infer:8000}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}     # 초과 시 판정 FAIL, 배치는 계속
      AI_POOL_SIZE: ${AI_POOL_SIZE:-4}                  # 배치 하나 안의 셀 동시 호출 상한. 잠정값, 실측 후 확정
      LLM_POOL_SIZE: ${LLM_POOL_SIZE:-2}                # 생성 요청 동시 실행 상한
      JAVA_TOOL_OPTIONS: "-Xmx1g -Duser.timezone=Asia/Seoul"

    networks: [battery-net]

  ai-infer:
    profiles: [ai]
    image: ${ECR_REGISTRY}/kt-aivle-big-proj-ai-infer:${AI_INFER_TAG:?AI_INFER_TAG is required}
    container_name: battery-ai-infer
    restart: unless-stopped
    # 변수 이름은 ai-infer 의 app/core/settings.py 가 정본이다.
    # 종전에 이 블록이 쓰던 DEVICE · S3_* · MODEL_CT_KEY · MODEL_RGB_KEY 는
    # ai-infer 가 하나도 읽지 않는다. 전부 무시되고 기본값으로 떨어졌다.
    # 특히 두 가지가 위험했다.
    #   INFERENCE_MODE 미지정 -> 기본값 stub. 배포에서 가짜 판정이 나간다
    #   ONNX_DEVICE    미지정 -> 기본값 cpu.  GPU 를 붙여놓고 CPU 로 돈다
    environment:
      # stub | ct-quality-onnx | ct-onnx | quality-onnx | rgb-onnx | onnx
      # 배포는 onnx 다. stub 으로 두면 고정 응답이 나가고 아무도 눈치채지 못한다.
      INFERENCE_MODE: ${INFERENCE_MODE:-onnx}
      ONNX_DEVICE: ${ONNX_DEVICE:-cuda}          # cpu | cuda

      # 모델 파일 경로. 컨테이너 안의 경로이지 S3 키가 아니다.
      # ai-infer 는 기동 시 S3 에서 가중치를 내려받지 않는다. 호스트에 미리 받아
      # /models 로 마운트해야 한다(아래 volumes). 번들 정본은 S3 의
      # models/ai-infer/onnx-20260809-01/ 이고 목록·체크섬은 레포의
      # deployment/model-manifest.json 에 있다.
      # 내려받기 = scripts/upload-model-bundle.ps1 의 역방향, 검증 = verify-model-manifest.ps1
      # 주의: CT 결함 모델만 파일명이 settings.py 의 기본값과 다르다.
      #       S3 키는 defect_ct.onnx 인데 매니페스트가 정한 로컬 파일명은
      #       defect_ct.torch211.onnx 다. 기본값 그대로 두면 파일을 못 찾는다.
      CT_QUALITY_MODEL_PATH: /models/quality_ct.onnx
      CT_DEFECT_MODEL_PATH: /models/defect_ct.torch211.onnx
      RGB_QUALITY_MODEL_PATH: /models/quality_rgb.onnx
      RGB_DEFECT_MODEL_DIR: /models/rgb_owlv2_onnx

      # CT 후처리. 매니페스트의 runtime 값과 같아야 한다. 다르면 판정이 달라진다.
      CT_POSTPROCESS_TYPE: ${CT_POSTPROCESS_TYPE:-NMS}                    # NMS | GREEDYNMM
      CT_POSTPROCESS_MATCH_METRIC: ${CT_POSTPROCESS_MATCH_METRIC:-IOS}    # IOU | IOS
      CT_POSTPROCESS_MATCH_THRESHOLD: ${CT_POSTPROCESS_MATCH_THRESHOLD:-0.44}

      # 판정 임계값. 기본값은 모델 검증 시점의 운영점이다. 함부로 바꾸면 판정이 흔들린다.
      # CT_QUALITY_THRESHOLD 는 확률이 아니라 로짓이라 음수를 받는다.
      CT_QUALITY_THRESHOLD: ${CT_QUALITY_THRESHOLD:--0.6227158308029175}
      CT_DEFECT_CONF_THRESHOLD: ${CT_DEFECT_CONF_THRESHOLD:-0.05}
      RGB_QUALITY_FAIL_THRESHOLD: ${RGB_QUALITY_FAIL_THRESHOLD:-0.3}
      # 모달리티별 유효 이미지 커버리지. 40장 기준 32장 이상이 통과다.
      CELL_MIN_VALID_COVERAGE: ${CELL_MIN_VALID_COVERAGE:-0.8}
      # RGB는 단일 이미지 OR가 아니라 셀 내 REJECT 이미지 비율로 판정한다.
      RGB_CELL_REJECT_RATE_THRESHOLD: ${RGB_CELL_REJECT_RATE_THRESHOLD:-0.7}
      CT_QUALITY_GATE_MODE: ${CT_QUALITY_GATE_MODE:-enforce}

      # 이미지는 BE 가 발급한 presigned URL 로 ai-infer 가 직접 GET 한다.
      IMAGE_DOWNLOAD_TIMEOUT_SECONDS: ${IMAGE_DOWNLOAD_TIMEOUT_SECONDS:-10}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-20971520}

      # 내부 호출 인증. module-ai 가 X-Internal-Api-Key 로 보내는 값과 같아야 한다.
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}

      # 분석이 끝나면 여기로 결과를 되돌려준다.
      # 요청에 담긴 callbackUrl 이 이 값과 다르면 ai-infer 가 400 을 낸다.
      # module-api 의 BACKEND_CALLBACK_URL 과 반드시 같은 값이어야 한다.
      BACKEND_CALLBACK_URL: ${BACKEND_CALLBACK_URL:-http://backend:8080/internal/ai/callbacks/cell}
      CALLBACK_TIMEOUT_SECONDS: ${CALLBACK_TIMEOUT_SECONDS:-10}
      CALLBACK_MAX_ATTEMPTS: ${CALLBACK_MAX_ATTEMPTS:-3}

      # 동시 분석 워커와 대기열. g6.xlarge 는 vCPU 가 4개뿐이고
      # CT 의 SAHI 타일링이 CPU 바운드라 여기를 올리면 CPU 가 먼저 포화한다.
      # 실측 전까지 기본값을 유지한다.
      CELL_ANALYSIS_WORKERS: ${CELL_ANALYSIS_WORKERS:-1}
      CELL_ANALYSIS_QUEUE_SIZE: ${CELL_ANALYSIS_QUEUE_SIZE:-4}
    volumes:
      # 가중치 번들. 읽기 전용으로 붙인다. 총 약 1.85 GB 다.
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      # 두 모델(CT·RGB) 로드 확인. 미로드 시 503.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s             # 기동 시 1회 모델 로드 + 워밍업
    networks: [battery-net]
    # 포트 미게시. BE 가 내부망에서 http://ai-infer:8000 으로만 호출한다.

  ai-infer-stub:
    profiles: [stub]
    build: ./stub
    container_name: battery-ai-infer-stub
    restart: unless-stopped
    # GPU 없는 FE·BE 개발자용 고정 응답 서버.
    # 사용법: .env 에서 AI_BASE_URL=http://ai-infer-stub:8000
    environment:
      STUB_LATENCY_MS: ${STUB_LATENCY_MS:-800}   # 라이브 추론 지연 흉내
      STUB_REJECT_RATE: ${STUB_REJECT_RATE:-0.3}
      STUB_FAIL_RATE: ${STUB_FAIL_RATE:-0.0}      # FAIL 수신 경로 시험용(기본 비활성)
    networks: [battery-net]

  replay:
    profiles: [replay]
    build: ./replay
    container_name: battery-replay
    restart: unless-stopped
    environment:
      # Compose config는 replay 프로파일이 꺼져 있어도 보간을 수행한다.
      # 빈 값은 허용하되 실제 replay 기동은 앱의 startup 검증에서 실패시킨다.
      REPLAY_FIXTURE_URI: ${REPLAY_FIXTURE_URI:-}
      REPLAY_FIXTURE_SHA256: ${REPLAY_FIXTURE_SHA256:-}
      REPLAY_REPORT_FIXTURE_URI: ${REPLAY_REPORT_FIXTURE_URI:-}
      REPLAY_REPORT_FIXTURE_SHA256: ${REPLAY_REPORT_FIXTURE_SHA256:-}
      REPLAY_DELAY_MS: ${REPLAY_DELAY_MS:-800}
      REPLAY_MAX_PENDING: ${REPLAY_MAX_PENDING:-64}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
      BACKEND_CALLBACK_URL: ${BACKEND_CALLBACK_URL:-http://backend:8080/internal/ai/callbacks/cell}
      CALLBACK_TIMEOUT_SECONDS: ${CALLBACK_TIMEOUT_SECONDS:-10}
      CALLBACK_MAX_ATTEMPTS: ${CALLBACK_MAX_ATTEMPTS:-3}
      AWS_REGION: ${S3_REGION:-ap-northeast-2}
      AWS_DEFAULT_REGION: ${S3_REGION:-ap-northeast-2}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request,sys; data=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if data.get('mode') == 'REPLAY' else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [battery-net]

  vlm:
    profiles: [ai, llm]              # ai 와 함께, 또는 --profile llm 으로 단독 기동
    image: ${ECR_REGISTRY}/kt-aivle-big-proj-vlm:${VLM_TAG:?VLM_TAG is required}
    container_name: battery-vlm
    restart: unless-stopped
    environment:
      DEVICE: ${DEVICE:-cuda}
      VLM_MODEL_ID: ${VLM_MODEL_ID}                    # 모델 교체는 이 값으로만 한다
      VLM_QUANTIZATION: ${VLM_QUANTIZATION:-4bit}      # none | 4bit | 8bit
      VLM_DTYPE: ${VLM_DTYPE:-fp16}                    # fp16 | bf16 — T4 는 bf16 미지원이라 배포 기본은 fp16
      HF_HOME: /cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vlm-cache:/cache/huggingface  # 가중치 재다운로드 방지. 컨테이너를 다시 만들어도 유지된다
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s             # 최초 기동은 가중치 다운로드가 포함돼 오래 걸린다
    networks: [battery-net]
    # 주의: ports 를 게시하지 마라. 인증이 없는 추론 서버가 그대로 노출된다.
    #       로컬에서 편하다는 이유로 열어두면 배포 형상에 그대로 따라간다. 내부망 전용.

  # =====================================================================
  # Data — 프로파일 없음(항상 기동)
  # =====================================================================
  redis:
    image: redis:7-alpine
    container_name: battery-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [battery-net]
    # 용도: 대시보드 status 캐시 전용. writer 는 BE 단독이다.
    # --save "" : 영속화를 끈다. Redis 에만 존재하는 데이터는 없다. DB 가 SSOT 다.
    # 주의: ports 를 게시하지 마라. 인증이 없다. 노출된 Redis 는 CONFIG SET dir + SAVE 로
    #       임의 파일 쓰기가 가능해 서버가 장악된다. 내부망 전용.
    #       로컬 디버깅은 docker compose exec redis redis-cli 로 한다.

networks:
  battery-net:
    driver: bridge

volumes:
  redis-data:
  vlm-cache:
